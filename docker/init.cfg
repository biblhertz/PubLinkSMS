# Simple Manifest Server configuration
#
# This file stores default values for the setup wizard (init.sh / init.bat).
# Edit values here and they will be pre-filled the next time you run init.
#
# DB_PASSWORD is NOT stored here — it is always freshly generated by init
# and written to .env alongside the other values below.
#
# Lines starting with # are ignored.

# External URL of the manifest server (no trailing slash)
FILE_STORE_URL=http://localhost/iiif_manifests

# Host port for the web server.
# Rootless Docker requires: sudo sysctl net.ipv4.ip_unprivileged_port_start=80
HTTP_PORT=80

# Basic-auth credentials for the API (legacy fallback — prefer API keys)
API_USERNAME=manifest_api_user
API_PASSWORD=

# Environment: 1=local docker, 2=remote docker
ENVIRONMENT=1

# Comma-separated list of valid series names
# Each entry becomes a top-level directory under the manifest store
VALID_SERIES=HSAH,MRAS,ARTB,JMHIS,annotations

# Comma-separated list of flexible series names (leave blank for none)
FLEXIBLE_SERIES=
