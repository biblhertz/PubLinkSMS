 server {
      listen 80;
      client_max_body_size 50M;
      index index.php index.html;
      error_log  /var/log/nginx/error.log;
      access_log /var/log/nginx/access.log;
      root /var/www/html;
      location ~ \.php|\.html$ {
          try_files $uri $uri/ =404;
          fastcgi_split_path_info ^(.+\.php|\.html)(/.+)$;
          fastcgi_pass php-fpm:9000;
          fastcgi_index index.php;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_param PATH_INFO $fastcgi_path_info;
          fastcgi_param HTTP_AUTHORIZATION $http_authorization;
          fastcgi_param HTTP_X_API_KEY $http_x_api_key;

     }
    
    # IIIF Generator direct publish endpoint
    location = /api/manifests {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/manifests.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Specific rules for api subdirectory
    # RESTful API endpoints for resources
    location ~ ^/api/v1/([^/]+)/?$ {
        # /api/v1/users -> /api_handler.php?resource=users
        rewrite ^/api/v1/([^/]+)/?$ /api/v1/rest.php?resource=$1 last;
    }

    # Serve JSON files with proper content type
    location ~* \.json$ {
        add_header Content-Type application/json;
        add_header Cache-Control "public, max-age=3600";
        
        # Enable CORS if needed
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        
        try_files $uri =404;
    }
 }